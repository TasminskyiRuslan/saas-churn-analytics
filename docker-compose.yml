services:
  db:
    image: postgres:16
    container_name: saas_churn_db
    environment:
      POSTGRES_DB: saas_churn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_churn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: